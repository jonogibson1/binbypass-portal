<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bin Bypass Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="demo.js"></script>
<link rel="stylesheet" href="bb.css">
</head><body><div class="app">
<div class="head">
  <div class="brand"><span class="mark">BB</span><span>Bin Bypass<br><small>live fleet</small></span></div>
  <span class="chip money" id="hero-money">$0.00 ready</span>
</div>
<div class="chips">
  <span class="chip ghost" id="f-live"><span class="dot live"></span>live</span>
  <span class="chip ghost" id="f-stale"><span class="dot stale"></span>stale</span>
  <span class="chip ghost" id="f-off"><span class="dot"></span>offline</span>
  <label class="chip" style="cursor:pointer"><input type="checkbox" id="demoToggle" checked style="margin:0 2px 0 0;accent-color:var(--blue)"> demo fleet <span class="badge">DEMO</span></label>
</div>
<div id="map"></div>
<div class="strip" id="strip"></div>
<div class="grid" id="root"><div class="card">loading…</div></div>
<div class="foot" id="updated">checking data freshness…</div>
<div class="foot"><a href="insights.html">trial insights</a> · <a href="power.html">unit power</a> · <a href="solar-live.html">solar rig</a> · build 2026-11-04.p1</div>
</div>
<script>
const SUPABASE_URL = "https://kyjrqpibtncvhxwcaovx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Q-XPiRdglnQscTd1Alh5UQ_hs4TWIsc"; // publishable, read-only via RLS
const LABELS = { "C39C32B7": "Ferny Hills — fence trial", "78F02C81": "Bench unit (carrier #2)", "05F0F1B6": "Bench unit (carrier #6)" };
const STALE_MS = 48 * 3600 * 1000, CENTS = 10;
// Everything from the database is HTML-escaped on arrival: unit IDs, labels,
// src, tier and the rest end up in innerHTML templates, and a packet's text
// fields come from whatever reached the broker.
const escHtml = (s) => s.replace(/[&<>"'`]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" }[c]));
const clean = (v) => typeof v === "string" ? escHtml(v) : Array.isArray(v) ? v.map(clean) : (v && typeof v === "object") ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, clean(x)])) : v;
const UNIT_RE = /^[0-9A-F]{8}$/;
async function sb(path){ const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}}); const j = clean(await r.json()); return Array.isArray(j) ? j.filter((x) => !("unit_id" in x) || UNIT_RE.test(x.unit_id) || String(x.unit_id).startsWith("demo-")) : j; }
const money = n => "$" + (n * CENTS / 100).toFixed(2);
function ago(iso){ const s=Math.max(0,(Date.now()-Date.parse(iso))/1000); if(s<60)return Math.round(s)+" s ago"; if(s<3600)return Math.round(s/60)+" min ago"; if(s<86400)return (s/3600).toFixed(1)+" h ago"; return (s/86400).toFixed(1)+" days ago"; }
function fresh(iso){ const m=(Date.now()-Date.parse(iso))/60000; return m<30?"live":m<180?"stale":"offline"; }
const statCache = {};
async function unitStats(id){
  const c = statCache[id]; if(c && Date.now()-c.t < 60000) return c.v;
  const ev = DEMO.isDemo(id) ? DEMO.events(id).slice(-1000) : await sb(`slot_events?unit_id=eq.${id}&select=slot,state,changed_at&order=changed_at.asc&limit=1000`);
  const weekAgo = Date.now() - 7*24*3600*1000; let deposits7=0, moved=0, dwellSum=0, dwellN=0; const openSince = {};
  for(const e of ev){ const t = Date.parse(e.changed_at);
    if(e.state===1){ openSince[e.slot]=t; if(t>=weekAgo) deposits7++; }
    else if(e.state===0 && openSince[e.slot]!=null){ moved++; dwellSum += t-openSince[e.slot]; dwellN++; delete openSince[e.slot]; }
    else if(e.state===255) delete openSince[e.slot]; }
  const dh = dwellN ? dwellSum/dwellN/3600000 : null;
  const v = { deposits7, moved, dwell: dh==null ? "—" : dh<1 ? Math.round(dh*60)+" min" : dh.toFixed(1)+" h" };
  statCache[id] = {t:Date.now(), v}; return v;
}
const statsHtml = s => `<div><b>${s.deposits7}</b><span>containers in, 7 days</span></div><div><b>${s.dwell}</b><span>avg dwell before collection</span></div><div><b>${s.moved}</b><span>moved, all time</span></div>`;
async function toggleStats(id){ const el=document.getElementById("st-"+CSS.escape(id)); if(!el) return; if(el.classList.contains("open")){ el.classList.remove("open"); return; } el.innerHTML='<div><span>loading…</span></div>'; el.classList.add("open"); el.innerHTML = statsHtml(await unitStats(id)); }
// ---- map ----
const tiles = getComputedStyle(document.documentElement).getPropertyValue("--tiles").trim() || "light_all";
const map = L.map("map",{scrollWheelZoom:false, zoomControl:true}).setView([-27.4,153.0],10);
L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${tiles === "dark_all" ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`,{attribution:"Esri, HERE, Garmin, OpenStreetMap contributors",maxZoom:16}).addTo(map);
const markers = {}; let fitted = false;
function plot(located){
  for(const u of located){
    const cls = u.demo ? "demo" : fresh(u.last_seen);
    const icon = L.divIcon({html:`<div class="pin ${cls}">${u.occ}</div>`, className:"", iconSize:[32,32], iconAnchor:[16,38], popupAnchor:[0,-34]});
    if(markers[u.unit_id]){ markers[u.unit_id].setLatLng([u.lat,u.lon]).setIcon(icon); }
    else {
      const m = L.marker([u.lat,u.lon],{icon}).addTo(map); m.bindPopup("loading…",{minWidth:220});
      m.on("click", async ()=>{ const s = await unitStats(u.unit_id);
        m.setPopupContent(`<b>${u.label||("Unit "+u.unit_id)}</b>${u.demo?' <span class="badge">DEMO</span>':''}<br><span class="sub"><span class="dot ${cls}"></span>${cls} · ${ago(u.last_seen)}</span><br><b style="color:var(--money);font-size:18px">${money(u.occ)}</b> <span class="sub">${u.occ} container${u.occ===1?"":"s"} ready</span><br><span class="sub">${s.deposits7} in this week · dwell ${s.dwell}</span><br><a href="unit.html?unit=${u.unit_id}">View unit →</a>`); });
      markers[u.unit_id] = m;
    }
  }
  if(!fitted && located.length){ const real = located.filter(u=>!u.demo); map.fitBounds((real.length?real:located).map(u=>[u.lat,u.lon]),{padding:[40,40],maxZoom:16}); fitted = true; }
}
// ---- fleet ----
async function tick(){
  try{
    const real = (await sb("units?select=*&order=last_seen.desc"))
      .filter(u => u.status !== "retired" && Date.now()-Date.parse(u.last_seen) < STALE_MS)
      .map(u => ({...u, label: u.label || LABELS[u.unit_id] || ""}));
    const showDemo = document.getElementById("demoToggle").checked;
    const units = real.concat(showDemo ? DEMO.units() : []);
    const latest = await sb("packets?select=received_at&order=id.desc&limit=1");
    document.getElementById("updated").textContent = latest.length ? `data updated ${ago(latest[0].received_at)} · page checked ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} · refreshes every 5 s` : "no data yet";
    const located = []; let h = ""; let totOcc=0, nLive=0, nStale=0, nOff=0, realOcc=0;
    for(const u of units){
      const pk = u.demo ? DEMO.packets(u.unit_id,1) : await sb(`packets?unit_id=eq.${u.unit_id}&order=id.desc&limit=1`);
      const slots = pk.length ? JSON.parse(pk[0].slots) : [];
      const occ = slots.filter(v=>v===1).length, flt = slots.filter(v=>v===255).length;
      const cls = u.demo ? "demo" : fresh(u.last_seen);
      if(!u.demo){ if(cls==="live") nLive++; else if(cls==="stale") nStale++; else nOff++; realOcc += occ; }
      totOcc += occ;
      if(u.lat!=null) located.push({...u, occ});
      const vb = pk.length && pk[0].vbat_mv ? (pk[0].vbat_mv/1000).toFixed(2)+" V" : "";
      const sig = pk.length && pk[0].rssi ? pk[0].rssi+" dBm" : "";
      h += `<div class="unit" onclick="toggleStats('${u.unit_id}')">
        <div class="top"><div><div class="name">${u.label || "Unit "+u.unit_id}${u.demo?'<span class="badge">DEMO</span>':''}</div><div class="label">${u.label ? "Unit "+u.unit_id : ""}</div></div>
          <div class="value"><b>${money(occ)}</b><span>${occ} of 6 ready</span></div></div>
        <div class="slots">${slots.map(v=>`<div class="s ${v===1?"in":v===255?"fault":""}">${v===1?"●":v===255?"✕":""}</div>`).join("")}</div>
        <div class="meta"><span><span class="dot ${cls}"></span>${cls} · ${ago(u.last_seen)}</span><span>${[vb,sig,pk.length?pk[0].src:""].filter(Boolean).join(" · ")}</span><a href="unit.html?unit=${u.unit_id}" onclick="event.stopPropagation()">View unit →</a></div>
        <div class="stats" id="st-${u.unit_id}"></div></div>`;
    }
    document.getElementById("hero-money").textContent = money(realOcc) + " ready";
    document.getElementById("strip").innerHTML =
      `<div class="tile"><b class="money">${money(totOcc)}</b><span>ready across the network${showDemo?" (incl. demo)":""}</span></div>` +
      `<div class="tile"><b>${totOcc}</b><span>containers in units now</span></div>` +
      `<div class="tile"><b>${nLive}</b><span>live units</span></div>` +
      `<div class="tile"><b>${nStale+nOff}</b><span>stale or offline</span></div>`;
    plot(located);
    const open = [...document.querySelectorAll(".stats.open")].map(e=>e.id);
    document.getElementById("root").innerHTML = h || '<div class="card">no units yet</div>';
    for(const id of open){ const el=document.getElementById(id); if(el){ el.classList.add("open"); el.innerHTML = statsHtml(await unitStats(id.slice(3))); } }
  }catch(e){ document.getElementById("root").innerHTML = '<div class="card">config needed: '+escHtml(String(e))+'</div>'; }
}
document.getElementById("demoToggle").addEventListener("change",()=>{ fitted=false; tick(); });
setInterval(tick,5000); tick();
</script></body></html>
